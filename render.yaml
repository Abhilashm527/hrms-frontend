# Render blueprint: the web app as a free static site.
# Requests to /api/* are passed through to the API, so the browser sees one address
# (the refresh cookie is SameSite=Strict and path /api/v1/auth; it is only sent to this site).
services:
  - type: web
    name: hrms-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # Hashed build files never change: cache for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page itself must always be fresh so a deploy takes effect at once.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-Jn8++EaqYN12quebOOhrgC3Hfd2+ZrR41TaEk9LxICA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hrms-api-haqa.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
